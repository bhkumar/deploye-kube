apiVersion: apps/v1
kind: Deployment

metadata:
  name: kubemaster
  labels:
    app: kubemaster

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kubemaster

  template:
    metadata:
      labels:
        app: kubemaster

    spec:
      containers:
        - name: kubemaster
          image: bhkumar/pipeline-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
